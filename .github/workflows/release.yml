name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: iban/go.mod
          cache-dependency-path: iban/go.sum
      - name: Build and publish release
        working-directory: iban
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go tool goreleaser release --clean

  bump-scoop-manifest:
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Point iban.json at the new release
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${TAG#v}"
          ZIP="iban_${VER}_windows_amd64.zip"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          gh release download "$TAG" --repo "$REPO" --pattern "iban_${VER}_checksums.txt" --dir "$RUNNER_TEMP"
          HASH=$(awk -v f="${ZIP}" '$2==f {print $1}' "$RUNNER_TEMP/iban_${VER}_checksums.txt")
          if [ -z "${HASH}" ]; then
            echo "checksum for ${ZIP} not found" >&2
            exit 1
          fi
          jq \
            --arg v "${VER}" --arg u "${BASE}/${ZIP}" --arg h "${HASH}" \
            '.version=$v | .architecture."64bit".url=$u | .architecture."64bit".hash=$h' \
            iban.json > /tmp/iban.json
          mv /tmp/iban.json iban.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add iban.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: scoop manifest ${TAG}"
          git push
