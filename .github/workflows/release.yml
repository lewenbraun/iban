name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: eban/go.mod
      - name: Build and publish release
        working-directory: eban
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go tool goreleaser release --clean

  bump-scoop-manifest:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Point eban.json at the new release
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          ZIP="eban_${VER}_windows_amd64.zip"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          curl -sL -o /tmp/checksums.txt "${BASE}/eban_${VER}_checksums.txt"
          HASH=$(awk -v f="${ZIP}" '$2==f {print $1}' /tmp/checksums.txt)
          if [ -z "${HASH}" ]; then
            echo "checksum for ${ZIP} not found" >&2
            exit 1
          fi
          jq \
            --arg v "${VER}" --arg u "${BASE}/${ZIP}" --arg h "${HASH}" \
            '.version=$v | .architecture."64bit".url=$u | .architecture."64bit".hash=$h' \
            eban.json > /tmp/eban.json
          mv /tmp/eban.json eban.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eban.json
          git commit -m "chore: scoop manifest ${TAG}"
          git push
